<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 430" width="300" height="430" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="side" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#14162b"/><stop offset="1" stop-color="#262a4d"/>
    </linearGradient>
    <linearGradient id="front" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#2d2f63"/><stop offset=".55" stop-color="#1d1f45"/><stop offset="1" stop-color="#121331"/>
    </linearGradient>
    <linearGradient id="marquee" x1="0" x2="1">
      <stop offset="0" stop-color="#ff3d8b"/><stop offset=".5" stop-color="#ffb347"/><stop offset="1" stop-color="#ff3d8b"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#0b1a3a"/><stop offset="1" stop-color="#091024"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#3a3d7c"/><stop offset="1" stop-color="#22244e"/>
    </linearGradient>
    <linearGradient id="stripe" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#ff3d8b"/><stop offset=".5" stop-color="#7c5cff"/><stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="ball" cx=".35" cy=".3" r=".7">
      <stop offset="0" stop-color="#ff8a8a"/><stop offset=".5" stop-color="#e5162f"/><stop offset="1" stop-color="#7a0614"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="scr"><path d="M92 112 L222 112 L216 212 L98 212 Z"/></clipPath>
  </defs>

  <!-- sombra no chão -->
  <ellipse cx="160" cy="418" rx="118" ry="9" fill="#000" opacity=".35"/>

  <!-- lateral -->
  <path d="M60 30 L96 18 L96 412 L60 404 Z" fill="url(#side)"/>
  <path d="M66 60 L90 52 L90 230 L66 238 Z" fill="url(#stripe)" opacity=".85"/>
  <path d="M66 250 L90 243 L90 262 L66 269 Z" fill="#22d3ee" opacity=".7"/>

  <!-- corpo frontal -->
  <path d="M96 18 L250 18 L250 92 L240 100 L236 222 L262 246 L262 290 L248 296 L248 412 L96 412 Z" fill="url(#front)"/>
  <path d="M96 18 L250 18" stroke="#5a5fb8" stroke-width="2"/>

  <!-- letreiro -->
  <rect x="92" y="26" width="162" height="52" rx="6" fill="#120c22"/>
  <rect x="98" y="31" width="150" height="42" rx="5" fill="url(#marquee)" filter="url(#glow)" opacity=".95"/>
  <text x="173" y="61" text-anchor="middle" font-family="Arial Black,Arial,sans-serif" font-weight="900" font-size="24" letter-spacing="3" fill="#fff" stroke="#7a1640" stroke-width="1.2">ARCADE</text>

  <!-- moldura da tela -->
  <path d="M84 100 L232 100 L226 222 L90 222 Z" fill="#0a0b1a"/>
  <path d="M92 112 L222 112 L216 212 L98 212 Z" fill="url(#screen)"/>
  <g clip-path="url(#scr)">
    <!-- jogo genérico em pixels -->
    <g fill="#ffffff" opacity=".7"><rect x="110" y="122" width="2" height="2"/><rect x="200" y="130" width="2" height="2"/><rect x="150" y="118" width="2" height="2"/><rect x="186" y="160" width="2" height="2"/><rect x="120" y="170" width="2" height="2"/></g>
    <g fill="#ff3d8b" filter="url(#glow)">
      <rect x="120" y="134" width="14" height="6"/><rect x="123" y="130" width="8" height="4"/><rect x="118" y="140" width="4" height="4"/><rect x="132" y="140" width="4" height="4"/>
    </g>
    <g fill="#ffb347" filter="url(#glow)">
      <rect x="152" y="134" width="14" height="6"/><rect x="155" y="130" width="8" height="4"/><rect x="150" y="140" width="4" height="4"/><rect x="164" y="140" width="4" height="4"/>
    </g>
    <g fill="#22d3ee" filter="url(#glow)">
      <rect x="184" y="134" width="14" height="6"/><rect x="187" y="130" width="8" height="4"/><rect x="182" y="140" width="4" height="4"/><rect x="196" y="140" width="4" height="4"/>
    </g>
    <rect x="157" y="166" width="2" height="10" fill="#fff" filter="url(#glow)"/>
    <g fill="#7CFF6B" filter="url(#glow)"><rect x="150" y="190" width="16" height="6"/><rect x="155" y="185" width="6" height="5"/></g>
    <rect x="98" y="203" width="118" height="3" fill="#7c5cff" opacity=".6"/>
    <text x="106" y="124" font-family="Courier New,monospace" font-size="7" font-weight="700" fill="#fff" opacity=".8">1UP 04250</text>
    <!-- reflexo -->
    <path d="M92 112 L150 112 L110 212 L98 212 Z" fill="#fff" opacity=".06"/>
  </g>

  <!-- painel de controle -->
  <path d="M236 222 L262 246 L262 262 L84 262 L84 246 L96 222 Z" fill="url(#panel)"/>
  <path d="M84 262 L262 262 L262 290 L84 290 Z" fill="#17183a"/>
  <path d="M84 246 L262 246" stroke="#6a6fd6" stroke-width="1.5" opacity=".6"/>
  <!-- joystick -->
  <ellipse cx="128" cy="244" rx="12" ry="4" fill="#0b0c1c"/>
  <rect x="126" y="226" width="4" height="18" rx="2" fill="#c9ccd8"/>
  <circle cx="128" cy="224" r="9" fill="url(#ball)"/>
  <!-- botões -->
  <g>
    <ellipse cx="170" cy="246" rx="8" ry="3.6" fill="#0b0c1c"/><ellipse cx="170" cy="243" rx="7.5" ry="3.6" fill="#ffb347"/>
    <ellipse cx="192" cy="242" rx="8" ry="3.6" fill="#0b0c1c"/><ellipse cx="192" cy="239" rx="7.5" ry="3.6" fill="#22d3ee"/>
    <ellipse cx="214" cy="246" rx="8" ry="3.6" fill="#0b0c1c"/><ellipse cx="214" cy="243" rx="7.5" ry="3.6" fill="#ff3d8b"/>
    <ellipse cx="236" cy="242" rx="8" ry="3.6" fill="#0b0c1c"/><ellipse cx="236" cy="239" rx="7.5" ry="3.6" fill="#7CFF6B"/>
  </g>

  <!-- porta das fichas -->
  <rect x="136" y="318" width="70" height="66" rx="6" fill="#0f1029" stroke="#3b3f86" stroke-width="2"/>
  <rect x="148" y="332" width="14" height="22" rx="3" fill="#2a1a08"/><rect x="152" y="337" width="6" height="12" rx="2" fill="#ffb347" filter="url(#glow)"/>
  <rect x="180" y="332" width="14" height="22" rx="3" fill="#2a1a08"/><rect x="184" y="337" width="6" height="12" rx="2" fill="#ffb347" filter="url(#glow)"/>
  <rect x="160" y="364" width="22" height="8" rx="2" fill="#2b2e66"/>

  <!-- detalhe inferior -->
  <rect x="96" y="402" width="152" height="10" fill="#0c0d22"/>
  <path d="M96 296 L96 402" stroke="url(#stripe)" stroke-width="3" opacity=".5"/>
  <path d="M248 296 L248 402" stroke="url(#stripe)" stroke-width="3" opacity=".5"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
