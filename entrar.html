<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:radial-gradient(circle at 85% 0,#692b54 0,transparent 38%),radial-gradient(circle at 0 100%,#22336b 0,transparent 40%),linear-gradient(145deg,#0c1125,#191238 60%,#0c1125);color:#fff;font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
.box{width:min(100%,420px)}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:21px;margin-bottom:26px}
.brand b{display:grid;place-items:center;width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,#ff4b62,#9c4dff);font-size:18px}
.card{background:#ffffff0f;border:1px solid #ffffff1f;border-radius:22px;padding:26px 24px;backdrop-filter:blur(10px);box-shadow:0 20px 60px #0006}
h1{font-size:25px;margin:0 0 4px}
.sub{color:#bdb9d2;margin:0 0 20px;font-size:14px}
.tabs{display:flex;background:#0000003d;border-radius:12px;padding:4px;margin-bottom:22px}
.tabs button{flex:1;border:0;background:none;color:#bdb9d2;padding:9px 6px;border-radius:9px;font:inherit;font-size:13.5px;font-weight:600;cursor:pointer}
.tabs button.on{background:#ffffff1f;color:#fff}
label{display:block;font-size:13px;color:#d6d3e6;margin:0 0 6px;font-weight:600}
input,textarea{width:100%;border:1px solid #ffffff2b;background:#0c1125b3;color:#fff;border-radius:12px;padding:13px 14px;font:inherit;margin-bottom:16px;outline:0}
input:focus,textarea:focus{border-color:#b77cff;box-shadow:0 0 0 3px #9c4dff33}
textarea{min-height:76px;resize:vertical}
.pass{position:relative}.pass input{padding-right:70px}.pass button{position:absolute;right:8px;top:7px;border:0;background:none;color:#c9b8ff;font:inherit;font-size:13px;padding:6px 8px;cursor:pointer}
.go{width:100%;border:0;border-radius:12px;padding:14px;font:inherit;font-weight:700;font-size:16px;color:#fff;background:linear-gradient(105deg,#f34f66,#974cf1);cursor:pointer;box-shadow:0 10px 26px #0005}
.go:disabled{opacity:.6;cursor:default}
.links{display:flex;justify-content:space-between;gap:10px;margin-top:16px;font-size:13.5px}
.links a{color:#c9b8ff;cursor:pointer;text-decoration:none}
.msg{border-radius:12px;padding:12px 14px;margin:0 0 16px;font-size:14px;display:none}
.msg.err{display:block;background:#ff4b6224;border:1px solid #ff4b6255;color:#ffd5db}
.msg.ok{display:block;background:#2ecc7124;border:1px solid #2ecc7155;color:#d3f8e2}
.hint{color:#9e9ab5;font-size:12.5px;margin:-8px 0 16px}

  if(!c.ok)return null;
  const d=JSON.parse((await c.json()).fields.json.stringValue);
  return {idToken:r.idToken,refreshToken:r.refreshToken,exp:Date.now()+(Number(r.expiresIn||3600)-120)*1000,email,user:d.user,role:d.role,permissions:d.permissions||[]};
 }catch(e){return null}
}
const msg=t=>{const m=document.getElementById('msg');m.textContent=t||'';m.className=t?'msg err':'msg';};
const volta=(()=>{const v=new URLSearchParams(location.search).get('volta')||'/';return /^\/(?!\/)[^\\\s]*$/.test(v)?v:'/'})();
let client,btnHtml='';
function token(){return new Promise((ok,no)=>{if(!window.google?.accounts?.oauth2)return no(new Error('O Google ainda está carregando, tente de novo.'));
 client=client||google.accounts.oauth2.initTokenClient({client_id:CLIENT_ID,scope:SCOPE,callback:r=>r.error?client._no(new Error('Login cancelado.')):client._ok(r),error_callback:()=>client._no(new Error('Login cancelado.'))});
 client._ok=ok;client._no=no;client.requestAccessToken({prompt:localStorage.getItem('bal-nuvem-ok')?'':'consent'})})}
async function drive(tok,path){const r=await fetch(API+path,{headers:{Authorization:'Bearer '+tok}});if(!r.ok)throw new Error('Drive '+r.status);return r}
async function list(tok,q){const j=await (await drive(tok,'?q='+encodeURIComponent(q+' and trashed=false')+'&fields=files(id,parents,modifiedTime)&orderBy=modifiedTime desc&pageSize=20&supportsAllDrives=true&includeItemsFromAllDrives=true')).json();return j.files||[]}
const media=async(tok,id)=>(await drive(tok,'/'+id+'?alt=media')).json();
async function entrar(){
 const btn=document.getElementById('go');btnHtml=btnHtml||btn.innerHTML;btn.disabled=true;
 try{
  msg('');const t=await token();localStorage.setItem('bal-nuvem-ok','1');
  const tok=t.access_token,tokenExp=Date.now()+(t.expires_in-60)*1000;
  msg('');
  const me=await (await fetch('https://openidconnect.googleapis.com/v1/userinfo',{headers:{Authorization:'Bearer '+tok}})).json();
  const email=String(me.email||'').toLowerCase();
  const fb=await firebase(tok,email);
  localStorage.setItem('bal-nuvem-email',email);localStorage.setItem('bal-nuvem-exp',String(tokenExp));
  // Cada conta só enxerga a própria pasta no Drive.
  let conta=null,pasta=null;
  for(const f of await list(tok,"name='balitu-espelho-conta.json'")){const c=await media(tok,f.id);if(c.emails?.includes(email)){conta=c;pasta=f.parents?.[0];break}}
  if(!conta){msg('A conta '+email+' ainda não tem acesso ao Balitu Database. Peça acesso ao administrador.');btn.disabled=false;return}
  document.getElementById('go').textContent='Entrando…';
  const achar=async n=>{const f=(await list(tok,"name='"+n+"' and '"+pasta+"' in parents"))[0];return f?media(tok,f.id):null};
  const catF=(await list(tok,"name='catalogo.json'"))[0];
  const [man,blobs,cat]=await Promise.all([achar('balitu-espelho-manifesto.json'),achar('balitu-espelho-blobs.json'),catF?media(tok,catF.id):null]);
  if(!man){msg('Não encontrei a cópia da sua conta. Tente mais tarde.');btn.disabled=false;return}
  const reg=await navigator.serviceWorker.register('/sw.js',{scope:'/'});
  const sw=(await navigator.serviceWorker.ready).active;
  await new Promise(ok=>{navigator.serviceWorker.addEventListener('message',e=>e.data?.type==='ok'&&ok(),{once:true});sw.postMessage({type:'estado',state:{token:tok,tokenExp,fb,user:conta.user,entries:man.entries,blobs:blobs||{},books:cat?.books||[],created:man.created}})});
  location.replace(BASE+volta);
 }catch(e){msg(e.message||'Não foi possível entrar.');btn.disabled=false;btn.innerHTML=btnHtml}
}
document.getElementById('go').onclick=entrar;
if(!('serviceWorker' in navigator)){msg('Este navegador não é compatível. Use o Chrome, Edge ou Safari atualizados.');document.getElementById('go').disabled=true}
</script>
